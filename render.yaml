services:
  - type: web
    name: temple-heritage-india
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@templeheritage.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
